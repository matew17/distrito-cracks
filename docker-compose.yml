services:
  db:
    image: postgres:15
    container_name: distritocracks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: distritocracks
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d distritocracks']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
